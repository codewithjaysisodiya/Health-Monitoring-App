<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HealthCare Login</title>

    <link rel="stylesheet"
          href="login.css">

</head>

<body>

    <div class="container">

        <div class="login-box">

            <h1>HealthCare Login</h1>

            <!-- Error Message -->
            <div id="loginError" class="login-error"></div>


            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>


            <p>
                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>
            </p>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
